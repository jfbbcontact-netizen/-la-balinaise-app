<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075b43"><link rel="manifest" href="manifest.json"><title>La Balinaise — Bons cadeaux</title>
<style>
:root{--green:#075b43;--gold:#c59627;--bg:#f6f7f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d292b}header{background:var(--green);color:#fff;padding:18px 16px calc(14px + env(safe-area-inset-top));position:sticky;top:0;z-index:5}header h1{margin:0;font-size:21px}header small{opacity:.8}main{padding:14px;max-width:720px;margin:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:13px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:var(--gold);color:#fff}.secondary{background:#fff;color:var(--green);border:1px solid #d9dedb}input,select,textarea{width:100%;padding:13px;border:1px solid #d7ddda;border-radius:11px;background:#fff;font-size:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 1px 4px #0001}.stat b{display:block;font-size:20px;color:var(--green)}.stat span{font-size:12px;color:#6d7777}.list{display:grid;gap:9px}.item{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 4px #0001;display:flex;justify-content:space-between;gap:10px}.item b{color:var(--green)}.item small{display:block;color:#6d7777;margin-top:4px}.badge{align-self:center;border-radius:999px;padding:7px 9px;font-size:12px;font-weight:700;white-space:nowrap}.follow{background:#dbeafa;color:#24577c}.used{background:#d9f1df;color:#23643a}.expired{background:#e5e5e5;color:#555}.unpaid{background:#f7d8d8;color:#8b2525}.remaining{background:#fff0bf;color:#735a00}.hidden{display:none}.panel{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 5px #0001;margin-top:12px}.row{display:grid;gap:6px;margin-bottom:12px}.back{background:transparent;color:var(--green);padding:6px 0}.voucher{width:min(100%,595px);aspect-ratio:2481/3508;background:#fff;position:relative;margin:auto}.voucherCanvas{display:block;width:100%;height:100%;object-fit:contain}.printControls{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}@media(max-width:420px){.amount{font-size:42px}.amountLabel{font-size:18px}.reason{font-size:16px}.validity{font-size:11px}}@media print{body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}header,main>section:not(#printView){display:none!important}#printView{display:block!important}.voucher{width:210mm;height:297mm;max-width:none}}
</style></head><body>
<header><h1>La Balinaise</h1><small>Gestion des bons cadeaux</small></header><main>
<section id="home"><div class="actions"><button class="primary" onclick="show('new')">＋ Nouveau bon</button><button class="secondary" onclick="show('search')">⌕ Rechercher</button><button class="secondary" onclick="shareAllVouchers()">↗ Exporter les bons</button></div>
<div class="stats"><div class="stat"><b id="countFollow">0</b><span>À suivre</span></div><div class="stat"><b id="countRemain">0</b><span>Reliquats</span></div><div class="stat"><b id="countExpired">0</b><span>Périmés</span></div></div><div class="list" id="list"></div></section>
<section id="new" class="hidden"><button class="back" onclick="show('home')">← Retour</button><div class="panel"><h2>Nouveau bon</h2>
<div class="row"><label>Montant</label><input id="amount" type="number" min="0" step="0.01" placeholder="60"></div>
<div class="row"><label>Paiement</label><select id="payment"><option value="">—</option><option>CB</option><option>Zettle</option><option>Esp</option><option>Loto</option><option>Loto des écoles</option></select></div>
<div class="row"><label>Date d'émission</label><input id="date" type="date"></div>
<div class="row"><label>Bénéficiaire / motif</label><input id="reason" placeholder="Anniversaire, gagnant du loto..."></div>
<div class="row"><label>Observation</label><textarea id="obs" rows="3"></textarea></div><button class="primary" style="width:100%" onclick="createVoucher()">Créer le bon</button></div></section>
<section id="search" class="hidden"><button class="back" onclick="show('home')">← Retour</button><div class="panel"><h2>Rechercher un bon</h2><input id="q" oninput="renderSearch()" placeholder="Numéro, bénéficiaire, motif..."><div id="searchResults" class="list" style="margin-top:12px"></div></div></section>
<section id="detail" class="hidden"></section><section id="printView" class="hidden"></section></main>
<script>
const SEED=[{"no": "20231217", "amount": 60, "payment": "Zettle", "date": "2023-12-17", "status": "Utilisé", "obs": ""}, {"no": "20231220", "amount": 30, "payment": "CB", "date": "2023-12-20", "status": "Utilisé", "obs": ""}, {"no": "2023122205", "amount": 40, "payment": "CB", "date": "2023-12-22", "status": "Reste 40 €", "obs": ""}, {"no": "2023122201", "amount": 60, "payment": "Zettle", "date": "2023-12-22", "status": "Utilisé", "obs": ""}, {"no": "20231223", "amount": 50, "payment": "Zettle", "date": "2023-12-23", "status": "Non payé", "obs": ""}, {"no": "2023122401", "amount": 60, "payment": "Zettle", "date": "2023-12-24", "status": "Non payé", "obs": ""}, {"no": "2024030601", "amount": 40, "payment": "Loto", "date": "2024-03-06", "status": "À suivre", "obs": ""}, {"no": "2024070301", "amount": 100, "payment": "Zettle", "date": "2024-07-03", "status": "Utilisé", "obs": ""}, {"no": "2024071701", "amount": 70, "payment": "CB", "date": "2024-07-17", "status": "Reste 11,70 €", "obs": ""}, {"no": "2024071901", "amount": 80, "payment": "Zettle", "date": "2024-07-19", "status": "Utilisé", "obs": ""}, {"no": "202412101", "amount": 65, "payment": "CB", "date": "2024-12-10", "status": "Utilisé", "obs": ""}, {"no": "2024121801", "amount": 50, "payment": "Zettle", "date": "2024-12-18", "status": "Utilisé", "obs": ""}, {"no": "2024121802", "amount": 50, "payment": "Zettle", "date": "2024-12-18", "status": "Utilisé", "obs": ""}, {"no": "2024121803", "amount": 50, "payment": "Zettle", "date": "2024-12-18", "status": "Utilisé", "obs": ""}, {"no": "2024121804", "amount": 50, "payment": "Zettle", "date": "2024-12-18", "status": "Utilisé", "obs": ""}, {"no": "2024121805", "amount": 50, "payment": "CB", "date": "2024-12-18", "status": "Utilisé", "obs": "Pascale"}, {"no": "2024121806", "amount": 60, "payment": "CB", "date": "2024-12-18", "status": "Utilisé", "obs": ""}, {"no": "2024121807", "amount": 60, "payment": "CB", "date": "2024-12-18", "status": "Utilisé", "obs": ""}, {"no": "2024122001", "amount": 60, "payment": "CB", "date": "2024-12-20", "status": "Utilisé", "obs": ""}, {"no": "2024122301", "amount": 60, "payment": "CB", "date": "2024-12-23", "status": "Utilisé", "obs": ""}, {"no": "2024122302", "amount": 60, "payment": "CB", "date": "2024-12-23", "status": "Utilisé", "obs": ""}, {"no": "2025022401", "amount": 60, "payment": "CB", "date": "2025-02-24", "status": "Utilisé", "obs": "Le bon est classé sous « Janvier 2025 » dans le listing"}, {"no": "2025022402", "amount": 60, "payment": "CB", "date": "2025-02-24", "status": "À suivre", "obs": "Le bon est classé sous « Janvier 2025 » dans le listing"}, {"no": "2025031001", "amount": 40, "payment": "Loto des écoles", "date": "2025-03-10", "status": "Utilisé", "obs": ""}, {"no": "2025031002", "amount": 54, "payment": "CB", "date": "2025-03-10", "status": "Utilisé", "obs": ""}, {"no": "LB2025070701", "amount": 75, "payment": "Esp", "date": "2025-07-07", "status": "Utilisé", "obs": ""}, {"no": "LB2025082901", "amount": 60, "payment": "Zettle", "date": "2025-08-29", "status": "Reste 6,40 €", "obs": ""}, {"no": "LB2025111501", "amount": 75, "payment": "CB", "date": "2025-11-15", "status": "Utilisé", "obs": ""}, {"no": "LB2025120501", "amount": 14, "payment": "", "date": "2025-12-05", "status": "À suivre", "obs": ""}, {"no": "LB2025121801", "amount": 150, "payment": "Zettle", "date": "2025-12-18", "status": "À suivre", "obs": ""}, {"no": "LB2025122001", "amount": 60, "payment": "Zettle", "date": "2025-12-20", "status": "À suivre", "obs": ""}, {"no": "LB2025122101", "amount": 40, "payment": "Zettle", "date": "2025-12-21", "status": "Utilisé", "obs": ""}, {"no": "LB2026021401", "amount": 40, "payment": "", "date": "2026-02-14", "status": "Reste 14,20 €", "obs": "Le bon est classé sous « Janvier 2026 » dans le listing"}, {"no": "LB2026052701", "amount": 61, "payment": "CB", "date": "2026-05-27", "status": "À suivre", "obs": ""}, {"no": "LB2026081701", "amount": 50, "payment": "", "date": "2026-08-17", "status": "À suivre", "obs": ""}, {"no": "LB2026092201", "amount": 20, "payment": "Loto des écoles", "date": "2026-09-22", "status": "À suivre", "obs": "Gagnant du loto"}, {"no": "LB2026092202", "amount": 20, "payment": "Loto des écoles", "date": "2026-09-22", "status": "À suivre", "obs": "Gagnant du loto"}];let vouchers=JSON.parse(localStorage.getItem('lb_vouchers')||'null')||SEED;
function save(){localStorage.setItem('lb_vouchers',JSON.stringify(vouchers))}function dateFR(s){if(!s)return'—';let[y,m,d]=s.split('-');return d+'/'+m+'/'+y}
function validityStart(v){let d=new Date(v.date+'T12:00:00');d.setDate(d.getDate()+1);return d}
function validityEnd(v){let d=new Date(v.date+'T12:00:00');d.setFullYear(d.getFullYear()+1);return d}
function expiry(v){let d=validityStart(v);d.setFullYear(d.getFullYear()+1);return d}
function status(v){if(v.status==='Annulé')return 'Annulé';if(v.status==='Utilisé'||v.status==='Non payé')return v.status;if(new Date()>=expiry(v))return'Périmé';return v.status||'À suivre'}
function badgeClass(s){if(s==='Annulé')return'expired';if(s==='Utilisé')return'used';if(s==='Périmé')return'expired';if(s==='Non payé')return'unpaid';if(s.startsWith('Reste'))return'remaining';return'follow'}
function displayStatus(v){let s=status(v);return s==='À suivre'&&v.remaining!=null?'Reste '+v.remaining.toFixed(2).replace('.',',')+' €':s}
function show(id){['home','new','search','detail','printView'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));if(id==='home')render();if(id==='search')renderSearch()}
function card(v){let s=displayStatus(v);return '<div class="item" onclick="detail(\''+v.no+'\')"><div><b>'+v.no+'</b><small>'+v.amount.toFixed(2).replace('.',',')+' € · '+(v.payment||'—')+'</small><small>'+dateFR(v.date)+'</small></div><span class="badge '+badgeClass(s)+'">'+s+'</span></div>'}
function render(){document.getElementById('countFollow').textContent=vouchers.filter(v=>status(v)==='À suivre').length;document.getElementById('countRemain').textContent=vouchers.filter(v=>displayStatus(v).startsWith('Reste')).length;document.getElementById('countExpired').textContent=vouchers.filter(v=>status(v)==='Périmé').length;let a=[...vouchers].sort((x,y)=>y.date.localeCompare(x.date)||y.no.localeCompare(x.no));document.getElementById('list').innerHTML=a.map(card).join('');save()}
function renderSearch(){let q=(document.getElementById('q').value||'').toLowerCase(),a=vouchers.filter(v=>(v.no+' '+(v.reason||'')+' '+(v.obs||'')).toLowerCase().includes(q));document.getElementById('searchResults').innerHTML=a.map(card).join('')||'<small>Aucun bon trouvé.</small>'}
function nextDay(s){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+1);return toISO(d)}function toISO(d){return d.toISOString().slice(0,10)}
function detail(no){let v=vouchers.find(x=>x.no===no);if(!v)return;let s=displayStatus(v),rem=v.remaining!=null?v.remaining:v.amount,history=Array.isArray(v.usage)?v.usage:[];let hist=history.length?'<ul style="padding-left:20px">'+history.map(h=>'<li>'+h.date+' : '+h.amount.toFixed(2).replace('.',',')+' €</li>').join('')+'</ul>':'Aucune utilisation enregistrée';document.getElementById('detail').innerHTML='<button class="back" onclick="show(\'home\')">← Retour</button><div class="panel"><h2>'+v.no+'</h2><p><b>'+v.amount.toFixed(2).replace('.',',')+' €</b> · '+(v.payment||'—')+'</p><p><b>Solde disponible : '+rem.toFixed(2).replace('.',',')+' €</b></p><p>Émis le : '+dateFR(v.date)+'<br>Valable à partir du : '+dateFR(nextDay(v.date))+'<br>Échéance : '+dateFR(toISO(expiry(v)))+'</p><p>Statut : <span class="badge '+badgeClass(s)+'">'+s+'</span></p><p>Bénéficiaire / motif : '+(v.reason||'—')+'<br>Observation : '+(v.obs||'—')+'</p><h3>Historique des utilisations</h3><div>'+hist+'</div><div class="actions">'+((s!=='Utilisé'&&s!=='Périmé'&&s!=='Annulé'&&s!=='Non payé'&&rem>0)?'<button class="primary" onclick="useVoucher(\''+v.no+'\')">Enregistrer une utilisation</button>':'')+((s!=='Utilisé'&&s!=='Périmé'&&s!=='Annulé')?'<button class="secondary" onclick="cancelVoucher(\''+v.no+'\')">Annuler le bon</button>':'')+'<button class="secondary" onclick="printVoucher(\''+v.no+'\')">Créer / imprimer le bon</button></div></div>';show('detail')}
function createVoucher(){let amount=parseFloat(document.getElementById('amount').value),date=document.getElementById('date').value||toISO(new Date()),payment=document.getElementById('payment').value,reason=document.getElementById('reason').value,obs=document.getElementById('obs').value;if(!amount||!date)return alert('Indique le montant et la date.');let p=date.replaceAll('-',''),nums=vouchers.filter(v=>v.no.startsWith('LB'+p)).map(v=>parseInt(v.no.slice(-2))||0),n=Math.max(0,...nums)+1,no='LB'+p+String(n).padStart(2,'0');vouchers.push({no,amount,payment,date,status:'À suivre',obs,reason});save();alert('Bon créé : '+no);printVoucher(no)}

function cancelVoucher(no){
  let v=vouchers.find(x=>x.no===no); if(!v)return;
  let s=status(v);
  if(s==='Utilisé'||s==='Périmé'||s==='Non payé'||s==='Annulé')return;
  if((v.remaining!=null && v.remaining < v.amount) || (Array.isArray(v.usage)&&v.usage.length)){
    if(!confirm('Ce bon a déjà été utilisé en partie. Voulez-vous vraiment l’annuler ?'))return;
  }else if(!confirm('Annuler définitivement le bon '+v.no+' ?'))return;
  v.status='Annulé'; v.cancelledAt=new Date().toLocaleDateString('fr-FR'); save(); detail(no);
}
function useVoucher(no){let v=vouchers.find(x=>x.no===no),cur=v.remaining!=null?v.remaining:v.amount,x=prompt('Montant utilisé (€) — disponible : '+cur.toFixed(2).replace('.',','));if(x===null)return;let n=parseFloat(x.replace(',','.'));if(!n||n<=0||n>cur)return alert('Montant invalide.');v.remaining=Math.max(0,cur-n);v.status=v.remaining===0?'Utilisé':'À suivre';if(!Array.isArray(v.usage))v.usage=[];v.usage.push({date:new Date().toLocaleDateString('fr-FR'),amount:n});save();detail(no)}
async function shareText(title,text,filename='bons-cadeaux.txt'){try{if(navigator.share){let data={title,text};if(navigator.canShare&&window.File){const file=new File([text],filename,{type:'text/plain'});if(navigator.canShare({files:[file]}))data={title,text,files:[file]};}await navigator.share(data);return;}}catch(e){if(e&&e.name==='AbortError')return;}const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);alert('Le fichier a été téléchargé. Tu peux ensuite le partager vers Notes ou Fichiers.');}
function voucherText(v){let s=displayStatus(v),rem=v.remaining!=null?v.remaining:v.amount,history=Array.isArray(v.usage)?v.usage:[];return `LA BALINAISE — BON CADEAU\n\nNuméro : ${v.no}\nMontant initial : ${v.amount.toFixed(2).replace('.',',')} €\nSolde disponible : ${rem.toFixed(2).replace('.',',')} €\nPaiement : ${v.payment||'—'}\nDate du bon : ${dateFR(v.date)}\nValable à compter du : ${dateFR(toISO(validityStart(v)))} jusqu’au ${dateFR(toISO(validityEnd(v)))}\nStatut : ${s}\nBénéficiaire / motif : ${v.reason||'—'}\nObservation : ${v.obs||'—'}\n${history.length?'\nUtilisations :\n'+history.map(h=>'- '+h.date+' : '+h.amount.toFixed(2).replace('.',',')+' €').join('\n'):''}`}
function shareVoucher(no){let v=vouchers.find(x=>x.no===no);if(v)shareText('La Balinaise — '+v.no,voucherText(v),v.no+'.txt')}
function shareAllVouchers(){let a=[...vouchers].sort((x,y)=>y.date.localeCompare(x.date)||y.no.localeCompare(x.no));let text='LA BALINAISE — EXPORT DES BONS CADEAUX\n\n'+a.map(voucherText).join('\n\n------------------------------\n\n');shareText('La Balinaise — Bons cadeaux',text,'la-balinaise-bons-cadeaux.txt')}
async function printVoucher(no){let v=vouchers.find(x=>x.no===no);if(!v)return;document.getElementById('printView').innerHTML='<div class="voucher"><canvas id="voucherCanvas" class="voucherCanvas" width="2481" height="3508"></canvas></div><div class="printControls"><button class="primary" onclick="window.print()">Imprimer / enregistrer en PDF</button><button class="secondary" onclick="shareVoucherPDF('"+"'+v.no+'"+"')">Envoyer le bon en PDF</button><button class="secondary" onclick="detail('"+"'+v.no+'"+"')">Retour</button></div>';show('printView');await drawVoucherCanvas(v)}
async function shareVoucherPDF(no){
  const v=vouchers.find(x=>x.no===no), canvas=document.getElementById('voucherCanvas');
  if(!v||!canvas)return;
  try{
    if(!window.jspdf||!window.jspdf.jsPDF){alert('La génération PDF n’est pas encore disponible. Vérifie la connexion Internet puis réessaie.');return;}
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'p',unit:'mm',format:'a4',compress:true});
    const dataUrl=canvas.toDataURL('image/png');
    pdf.addImage(dataUrl,'PNG',0,0,210,297,undefined,'FAST');
    const blob=pdf.output('blob');
    const file=new File([blob],v.no+'.pdf',{type:'application/pdf'});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({title:'La Balinaise — '+v.no,text:'Bon cadeau '+v.no,files:[file]});
      return;
    }
    if(navigator.share){await navigator.share({title:'La Balinaise — '+v.no,text:'Bon cadeau '+v.no});return;}
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=v.no+'.pdf';a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    alert('Le PDF a été téléchargé. Tu peux ensuite l’envoyer par Mail, WhatsApp ou Message.');
  }catch(e){
    if(e&&e.name==='AbortError')return;
    console.error(e);
    alert('L’envoi du PDF n’a pas pu être effectué.');
  }
}
async function drawVoucherCanvas(v){const canvas=document.getElementById('voucherCanvas');const ctx=canvas.getContext('2d');const bg=new Image();bg.src='bon-background-source-hd.png';await new Promise((resolve,reject)=>{bg.onload=resolve;bg.onerror=reject});ctx.clearRect(0,0,2481,3508);ctx.drawImage(bg,0,0,2481,3508);const gold='#c59627',blue='#153c4b';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillStyle=gold;ctx.font='700 170px Georgia, Times New Roman, serif';ctx.fillText(v.amount.toFixed(2).replace('.',',')+' €',1240.5,1535);ctx.fillStyle=blue;ctx.font='62px Helvetica, Arial, sans-serif';let reason=v.reason?('Pour '+v.reason):'';drawWrappedCenter(ctx,reason,1240.5,1800,1500,78);ctx.font='30px Helvetica, Arial, sans-serif';ctx.fillText('Carte cadeau valable 1 an à compter du '+dateFR(nextDay(v.date)),1240.5,2810);ctx.fillText('Carte Cadeau n° '+v.no,1240.5,2875)}
function drawWrappedCenter(ctx,text,cx,y,maxWidth,lineHeight){if(!text)return;let words=text.split(/\s+/),lines=[],line='';for(const w of words){let test=line?line+' '+w:w;if(ctx.measureText(test).width<=maxWidth)line=test;else{if(line)lines.push(line);line=w}}if(line)lines.push(line);lines.forEach((l,i)=>ctx.fillText(l,cx,y+i*lineHeight))}
document.getElementById('date').value=toISO(new Date());render();
</script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></body></html>
